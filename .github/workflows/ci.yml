name: IndiFit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Analysis & Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Check Code Style & Analysis
        run: flutter analyze

      - name: Verify Code Graph & Architecture Boundaries
        run: python3 tool/generate_code_graph.py

      - name: Verify Generated Code
        run: dart run build_runner build --delete-conflicting-outputs && dart format lib/data/database/app_database.g.dart && git diff --exit-code

  unit_widget:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests (Excluding Goldens)
        run: flutter test --exclude-tags golden --timeout 2m --reporter github

  goldens:
    name: Golden Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Golden Tests
        run: flutter test --tags golden --timeout 2m --reporter github

  android_release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [static]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Dummy Release Keystore
        run: |
          echo "storePassword=ci_release_password" > android/key.properties
          echo "keyPassword=ci_release_password" >> android/key.properties
          echo "keyAlias=ci_release_alias" >> android/key.properties
          echo "storeFile=ci-release.keystore" >> android/key.properties
          keytool -genkeypair -noprompt -storetype JKS -keystore android/app/ci-release.keystore -alias ci_release_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass ci_release_password -keypass ci_release_password -dname "CN=IndiFit, OU=Dev, O=IndiFit, L=Local, S=Local, C=IN"

      - name: Build Release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Build Release App Bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build appbundle --release --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify Android Release Artifacts
        run: |
          bash tool/verify_r09_artifacts.sh \
            --android-apk build/app/outputs/flutter-apk/app-release.apk \
            --android-aab build/app/outputs/bundle/release/app-release.aab \
            --allow-ci-signing \
            --evidence build/release-evidence/android-ci.txt

      - name: Retain Android Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-android-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-evidence/android-ci.txt

  ios_release:
    name: iOS Release Build
    runs-on: macos-15
    needs: [static]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned Release App
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build ios --release --no-codesign --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify iOS Release Artifact
        run: |
          bash tool/verify_r09_artifacts.sh \
            --ios-app build/ios/iphoneos/Runner.app \
            --allow-unsigned-ios \
            --evidence build/release-evidence/ios-unsigned.txt
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/release-evidence/Runner-unsigned.app.zip

      - name: Retain iOS Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-ios-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/release-evidence/Runner-unsigned.app.zip
            build/release-evidence/ios-unsigned.txt

  backend:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Backend Tests (pytest)
        env:
          INDIFIT_API_KEY: ci-backend-test-secret
        run: python -m pytest backend/tests -q

      - name: Compile Syntax Check
        run: python -m py_compile backend/main.py
