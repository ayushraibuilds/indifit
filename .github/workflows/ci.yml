name: IndiFit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a pull request needs. Pushes to main run everything.
  # Jobs skipped by an `if` report "Skipped", which still satisfies a
  # required status check.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify Changed Files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "$changed"
          # Docs and the backend (which has its own job) don't need Flutter.
          if echo "$changed" | grep -qvE '^(docs/|doc/|backend/)|\.md$'; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi
          # Release builds only run on PRs that change native code,
          # dependencies or CI. Every push to main still builds both.
          if echo "$changed" | grep -qE '^(ios/|android/|pubspec\.(yaml|lock)$|\.github/workflows/)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Static Analysis & Boundaries
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Check Code Style & Analysis
        run: flutter analyze

      # The graph is generated, not committed, so it never conflicts between
      # PRs. --ci fails on empty catch blocks in P0 paths.
      - name: Verify Code Graph & Architecture Boundaries
        run: python3 tool/generate_code_graph.py --ci

      - name: Retain Code Graph
        uses: actions/upload-artifact@v4
        with:
          name: indifit-code-graph
          retention-days: 14
          path: docs/architecture/code-graph.json

      - name: Verify Generated Code
        run: dart run build_runner build --delete-conflicting-outputs && dart format lib/data/database/app_database.g.dart && git diff --exit-code

  unit_widget:
    name: Unit & Widget Tests (shard ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests (Excluding Goldens)
        run: flutter test --exclude-tags golden --timeout 2m --reporter github --total-shards 4 --shard-index ${{ matrix.shard }}

  # One stable check name for branch protection, whatever the shard count.
  unit_widget_result:
    name: Unit & Widget Tests
    needs: [changes, unit_widget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Shard Results
        run: |
          result="${{ needs.unit_widget.result }}"
          echo "Shards: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  goldens:
    name: Golden Tests (Linux, shard ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Golden Tests
        run: flutter test --tags golden --timeout 2m --reporter github --total-shards 2 --shard-index ${{ matrix.shard }}

  goldens_result:
    name: Golden Tests (Linux)
    needs: [changes, goldens]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Shard Results
        run: |
          result="${{ needs.goldens.result }}"
          echo "Shards: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  android_release:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Dummy Release Keystore
        run: |
          echo "storePassword=ci_release_password" > android/key.properties
          echo "keyPassword=ci_release_password" >> android/key.properties
          echo "keyAlias=ci_release_alias" >> android/key.properties
          echo "storeFile=ci-release.keystore" >> android/key.properties
          keytool -genkeypair -noprompt -storetype JKS -keystore android/app/ci-release.keystore -alias ci_release_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass ci_release_password -keypass ci_release_password -dname "CN=IndiFit, OU=Dev, O=IndiFit, L=Local, S=Local, C=IN"

      - name: Build Release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build apk --release --dart-define=SENTRY_DSN="$SENTRY_DSN"

      # Pull requests build the APK only; pushes to main also build the
      # bundle and check both are signed with the same key.
      - name: Build Release App Bundle
        if: github.event_name != 'pull_request'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build appbundle --release --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify Android Release Artifacts
        run: |
          aab_args=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            aab_args=(--android-aab build/app/outputs/bundle/release/app-release.aab)
          fi
          bash tool/verify_r09_artifacts.sh \
            --android-apk build/app/outputs/flutter-apk/app-release.apk \
            "${aab_args[@]}" \
            --allow-ci-signing \
            --evidence build/release-evidence/android-ci.txt

      - name: Retain Android Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-android-release-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-evidence/android-ci.txt

  ios_release:
    name: iOS Release Build
    runs-on: macos-15
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned Release App
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: flutter build ios --release --no-codesign --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Verify iOS Release Artifact
        run: |
          bash tool/verify_r09_artifacts.sh \
            --ios-app build/ios/iphoneos/Runner.app \
            --allow-unsigned-ios \
            --evidence build/release-evidence/ios-unsigned.txt
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/release-evidence/Runner-unsigned.app.zip

      - name: Retain iOS Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-ios-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/release-evidence/Runner-unsigned.app.zip
            build/release-evidence/ios-unsigned.txt

  backend:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Backend Tests (pytest)
        env:
          INDIFIT_API_KEY: ci-backend-test-secret
        run: python -m pytest backend/tests -q

      - name: Compile Syntax Check
        run: python -m py_compile backend/main.py
