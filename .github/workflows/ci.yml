name: IndiFit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flutter_ci:
    name: Flutter CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check Code Style & Analysis
        run: flutter analyze

      - name: Run Critical Journey Gate
        run: bash tool/verify_r09_release.sh --tests-only --skip-analysis

      - name: Verify Generated Code
        run: dart run build_runner build --delete-conflicting-outputs && dart format lib/data/database/app_database.g.dart && git diff --exit-code

      - name: Run Unit Tests
        run: flutter test -j 1 --coverage

      - name: Generate Dummy Release Keystore
        run: |
          echo "storePassword=ci_release_password" > android/key.properties
          echo "keyPassword=ci_release_password" >> android/key.properties
          echo "keyAlias=ci_release_alias" >> android/key.properties
          echo "storeFile=ci-release.keystore" >> android/key.properties
          keytool -genkeypair -noprompt -storetype JKS -keystore android/app/ci-release.keystore -alias ci_release_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass ci_release_password -keypass ci_release_password -dname "CN=IndiFit, OU=Dev, O=IndiFit, L=Local, S=Local, C=IN"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle
        run: flutter build appbundle --release

      - name: Verify Android Release Artifacts
        run: |
          bash tool/verify_r09_artifacts.sh \
            --android-apk build/app/outputs/flutter-apk/app-release.apk \
            --android-aab build/app/outputs/bundle/release/app-release.aab \
            --allow-ci-signing \
            --evidence build/release-evidence/android-ci.txt

      - name: Retain Android Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-android-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-evidence/android-ci.txt

  ios_release:
    name: iOS Release Build
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned Release App
        run: flutter build ios --release --no-codesign

      - name: Verify iOS Release Artifact
        run: |
          bash tool/verify_r09_artifacts.sh \
            --ios-app build/ios/iphoneos/Runner.app \
            --allow-unsigned-ios \
            --evidence build/release-evidence/ios-unsigned.txt
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/release-evidence/Runner-unsigned.app.zip

      - name: Retain iOS Release Evidence
        uses: actions/upload-artifact@v4
        with:
          name: indifit-ios-release-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/release-evidence/Runner-unsigned.app.zip
            build/release-evidence/ios-unsigned.txt

  backend_ci:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          INDIFIT_API_KEY: ci-backend-test-secret
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Compile Syntax Check
        run: python -m py_compile backend/main.py
