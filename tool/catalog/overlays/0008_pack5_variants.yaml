# UR-06: "<dish> (Dhaba Style (High oil))" and "<dish> (Diet prep (Low oil /
# breast only))" were never linked to their dish: their label holds brackets,
# which the variant pattern skipped. From pack 5 build.py reads one nested
# pair, and these labels say what the variants change. Ids stay; only
# variant_of, variant_label and tags are added.
#
# UR-07: retired, never deleted (past logs resolve to the replacement):
# - "breast only" on eggs, fish and mutton, where the label means nothing;
# - "Medium cup / Glass" copies with exactly their dish's kcal in the same
#   measure: a second row for the same thing.
