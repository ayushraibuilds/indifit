# The allowed key-ingredient vocabulary (pack 8 on, TF-2 C).
#
# A dish's `key_ingredients` are 2-6 words from `vocabulary`, qualitative
# only: no amounts. validate.py rejects any other word. build.py copies the
# vocabulary and its synonyms to assets/catalog/key_ingredients.json, which
# "Cook with what I have" normalises typed and spoken ingredients against.
#
# - vocabulary: canonical word -> other names (Hindi, Hinglish, English);
#   every name maps to exactly one word.
# - recipe_words: each ingredient key a USDA recipe source uses -> its word.
#   Keys in `pantry` are never listed (oil, salt, spices, water).
version: 8
pantry: [oil, mustard_oil, sesame_oil, salt, water, spices, green_chilli]
recipe_words:
